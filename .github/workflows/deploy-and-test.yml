name: deploy-and-test.yml

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Deploy & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd web_frontend
          npm ci

      - name: Build React Application
        run: |
          cd web_frontend
          npm run build
        env:
          NODE_ENV: production

      - name: Run Eslint Static Analysis
        run: |
          cd web_frontend
          npm run lint || echo "Lint warnings bypass"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web_frontend/dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true

  run-e2e-selenium:
    name: Run Live Selenium Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl requests webdriver-manager

      - name: Wait for GitHub Pages Deployment
        run: sleep 30

      - name: Run Live Deployment Verification
        run: python automation/tests/run_deployment.py
        env:
          BASE_URL: https://jayakrishna2005.github.io/BorrowBuddy/

      - name: Run Selenium E2E Tests against Live URL
        run: python automation/tests/run_selenium.py
        env:
          BASE_URL: https://jayakrishna2005.github.io/BorrowBuddy/

      - name: Run Report Compiler
        run: python automation/compile_report.py

      - name: Upload Consolidated E2E Excel Reports
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Excel-Reports
          path: Test Results/Excel/
          retention-days: 30

      - name: Upload HTML execution-reports
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-HTML-Dashboards
          path: Test Results/HTML/
          retention-days: 30

      - name: Upload JSON and Summary Results
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Execution-Summaries
          path: |
            Test Results/JSON/
            Test Results/Summary/
          retention-days: 30

      - name: Publish Action Run Summary Markdown
        run: cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
